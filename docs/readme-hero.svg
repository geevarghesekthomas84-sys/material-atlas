<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Material Atlas</title>
  <desc id="desc">A dark editorial banner showing an icon search and a specimen grid.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#293744" stroke-width="1"/></pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253f44"/><stop offset="1" stop-color="#17212b"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#101a23"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" opacity=".45"/>
  <path d="M0 56H1200M0 364H1200" stroke="#43515a" opacity=".65"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="60" y="36" fill="#b0c6c2" font-size="12" font-weight="700" letter-spacing="3">MATERIAL / ATLAS</text>
    <text x="1010" y="36" fill="#b0c6c2" font-size="12" letter-spacing="2">ICON INDEX — 01</text>
    <text x="60" y="132" fill="#a9f1bf" font-size="13" font-weight="700" letter-spacing="3">THE ICON WORKBENCH</text>
    <text x="56" y="214" fill="#f5f2e9" font-size="62" font-weight="700" letter-spacing="-3">Find the icon</text>
    <text x="56" y="280" fill="#f5f2e9" font-size="62" font-weight="700" letter-spacing="-3">that <tspan fill="#a9f1bf">fits.</tspan></text>
    <text x="60" y="327" fill="#b8c9c6" font-size="17">Classic icons. Current symbols. Original additions.</text>
    <text x="60" y="393" fill="#a8bab7" font-size="12" letter-spacing="2">SEARCH  /  COMPARE  /  DOWNLOAD</text>
    <text x="951" y="393" fill="#a8bab7" font-size="12" letter-spacing="2">OPEN SOURCE PROJECT</text>
  </g>
  <g transform="translate(722 82)">
    <rect width="418" height="250" rx="17" fill="url(#glow)" stroke="#718782" stroke-width="1.3"/>
    <rect x="19" y="18" width="380" height="33" rx="8" fill="#101a23" stroke="#647773"/>
    <circle cx="39" cy="34" r="6" fill="none" stroke="#a9f1bf" stroke-width="2"/><path d="m43 39 6 6" stroke="#a9f1bf" stroke-width="2"/>
    <text x="61" y="39" fill="#94aaa6" font-family="Arial,Helvetica,sans-serif" font-size="12">Search icons...</text>
    <g fill="#e8f2e8" stroke="#536c68">
      <rect x="19" y="68" width="85" height="85" rx="10"/><rect x="117" y="68" width="85" height="85" rx="10"/><rect x="215" y="68" width="85" height="85" rx="10"/><rect x="313" y="68" width="85" height="85" rx="10"/>
      <rect x="19" y="164" width="85" height="67" rx="10"/><rect x="117" y="164" width="85" height="67" rx="10"/><rect x="215" y="164" width="85" height="67" rx="10"/><rect x="313" y="164" width="85" height="67" rx="10"/>
    </g>
    <g fill="none" stroke="#15272c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m43 108 19-17 19 17v24H43zM56 132v-16h12v16"/>
      <circle cx="156" cy="108" r="16"/><path d="m168 120 11 11"/>
      <path d="m257 91 5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
      <path d="M335 105h40M355 85v40"/>
      <path d="m45 198 11 11 23-25"/>
      <path d="M141 199h37m-18-18v36"/>
      <path d="m242 210 15-30 15 30z"/>
      <path d="M335 189h42m-42 13h30"/>
    </g>
  </g>
