name: Validate
on:
  push:
  pull_request:
jobs:
  python-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check updater and manifest
        run: |
          python -m unittest discover -s tests -v
          python preview/build_manifest.py
          python originals/build_manifest.py
          python mcp-server/build_catalog.py
          git diff --exit-code -- preview/icons.json originals/manifest.json mcp-server/catalog.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Browser checks
        run: |
          npm ci
          node --test mcp-server/test.cjs
          node --test hosted-mcp/test.mjs
          npx playwright install --with-deps chromium
          npm run test:browser
